
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Alertas Endura</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f8f8;
            margin: 0; padding: 0;
        }
        .header {
            background-color: #7AC943;
            padding: 20px;
            text-align: center;
        }
        .header img {
            max-height: 60px;
        }
        .container {
            max-width: 600px;
            background: #fff;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #4CAF50;
        }
        input[type='password'] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button, a.button {
            display: inline-block;
            padding: 10px 15px;
            background: #7AC943;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
        }
        a.button:hover, button:hover {
            background: #5ca82c;
        }
        .section {
            margin-bottom: 20px;
        }
        .icon {
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ENDURA</h1>
        <p>Exploring Chemistry</p>
    </div>
    <div class="container">
        <h2>Painel de Alertas</h2>
        <p>Digite a senha para acessar o painel:</p>
        <input type="password" id="password" placeholder="Senha">
        <button onclick="checkPassword()">Entrar</button>

        <div id="protected" style="display:none;">
            <div class="section">
                <h3><img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="icon">Alertas Google</h3>
                <a class="button" href="https://www.google.com/alerts" target="_blank">Criar Alertas</a>
            </div>

            <div class="section">
                <h3><img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Google_Scholar_logo.svg" class="icon">Alertas Google Acadêmico</h3>
                <a class="button" href="https://scholar.google.com" target="_blank">Criar Alertas</a>
            </div>

            <div class="section">
                <h3><img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" class="icon">LinkedIn</h3>
                <a class="button" href="https://www.linkedin.com" target="_blank">Seguir Empresas</a>
            </div>

            <div class="section">
                <h3><img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Open_book_nae_02.svg" class="icon">Publicações Especializadas</h3>
                <a class="button" href="https://cen.acs.org" target="_blank">C&EN</a><br>
                <a class="button" href="https://cefic.org" target="_blank">CEFIC</a><br>
                <a class="button" href="https://news.agropages.com" target="_blank">Agropages</a><br>
                <a class="button" href="https://chemlinked.com" target="_blank">ChemLinked</a><br>
                <a class="button" href="http://pan-international.org" target="_blank">PAN International</a>
            </div>

            <div class="section">
                <h3>Guia (PDF)</h3>
                <a class="button" href="Guia_Interativo_Alertas_Endura.pdf" download>Baixar Guia</a>
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            var input = document.getElementById('password').value;
            var correct = 'endura123';
            if (input === correct) {
                document.getElementById('protected').style.display = 'block';
            } else {
                alert('Senha incorreta.');
            }
        }
    </script>
</body>
</html>
